format_version = 1
description = "UI min/max definitions for KORAL input widgets (model: test_dummy)."

[parameters.ion_mass_amu]
label = "Mass (amu)"
unit = "amu"
min = 0.01
max = 1000.0
decimals = 3

[parameters.energy_min_keV]
label = "Energy min (keV)"
unit = "keV"
min = 0.0
max = 1000000.0
decimals = 2

[parameters.energy_max_keV]
label = "Energy max (keV)"
unit = "keV"
min = 0.0
max = 1000000.0
decimals = 2

[parameters.compound_correction]
label = "Compound correction"
unit = ""
min = 0.0
max = 10.0
decimals = 4
step = 0.01
default = 1.0
