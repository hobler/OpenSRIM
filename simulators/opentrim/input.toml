# -----------------------------------------------------------------------------

[[layer]]
name = "Layer 1"
width = 10000.0
density = 1.0
compound_correction = 1.0
gas = false
roughness = 0.0

    [[layer.element]]
    symbol = "Si"
    name = "Silicon"
    Z = 14
    M = 0.0
    stoichiometry = 1.0
    displacement_energy = 25.0
