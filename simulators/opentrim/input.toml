# -----------------------------------------------------------------------------
[simulation]
# -----------------------------------------------------------------------------

follow_recoils = true
nions = 10000
nions_update = 100
rng_seed = 12345
workdir = "./"

# -----------------------------------------------------------------------------
[beam]
# -----------------------------------------------------------------------------

symbol = "As"
name = "Arsenic"
